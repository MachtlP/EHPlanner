<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1a16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Planner</p>
        <h1>Eisenhower</h1>
      </div>
      <p id="matrix-scope" class="scope">All streams</p>
    </header>

    <div id="filters" class="filters" aria-label="Filter the matrix"></div>

    <section class="matrix" id="matrix" aria-label="Eisenhower matrix"></section>

    <div class="below">
      <section class="panel" aria-label="Streams">
        <div class="panel-head">
          <h2>Streams</h2>
          <button type="button" class="btn" id="add-stream">Add stream</button>
        </div>
        <div id="stream-list" class="stream-list"></div>
      </section>

      <section class="panel" aria-label="Done">
        <div class="panel-head">
          <h2>Done <span id="done-count" class="count-inline">0</span></h2>
          <button type="button" class="btn ghost" id="done-toggle">Show</button>
        </div>
        <div id="done-list" class="done-list"></div>
      </section>
    </div>
  </div>

  <dialog id="task-dialog">
    <form id="task-form">
      <h3 id="task-dialog-title">Add task</h3>
      <label>Title
        <input name="title" required maxlength="200" autocomplete="off">
      </label>
      <label>Note
        <textarea name="note" maxlength="2000" rows="3"></textarea>
      </label>
      <label>Stream
        <select name="stream_id" required></select>
      </label>
      <div class="switches">
        <label class="switch"><input type="checkbox" name="important"> Important</label>
        <label class="switch"><input type="checkbox" name="urgent"> Urgent</label>
      </div>
      <p id="landing" class="landing">Lands in Later</p>
      <p id="task-error" class="form-error" hidden></p>
      <footer class="dialog-actions">
        <button type="button" class="btn danger" id="task-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="task-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="stream-dialog">
    <form id="stream-form">
      <h3 id="stream-dialog-title">New stream</h3>
      <label>Name
        <input name="name" required maxlength="40" autocomplete="off">
      </label>
      <p id="stream-error" class="form-error" hidden></p>
      <footer class="dialog-actions">
        <button type="button" class="btn danger" id="stream-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="stream-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </dialog>

  <div id="ghost" hidden></div>
  <p id="toast" class="toast" hidden></p>
  <script src="/static/app.js"></script>
</body>
</html>
